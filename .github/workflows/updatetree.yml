name: Scan /code and update tree.json

# 触发条件改成了：当别的 workflow 成功完成时触发
on:
  workflow_run:
    workflows: ["Sync main to blogpage/code"] # 这里是你的那个同步工作流的 name，必须一字不差！
    types:
      - completed

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run directory scanner
        run: |
          python -c "
import os, json
def scan(path):
    tree=[]
    try:
        for i in sorted(os.listdir(path)):
            if i.startswith('.'): continue
            full=os.path.join(path,i)
            rel=os.path.relpath(full,'code')
            if os.path.isdir(full):
                tree.append({'name':i,'type':'folder','children':scan(full)})
            else:
                tree.append({'name':i,'type':'file','path':rel.replace('\\','/')})
    except: pass
    return tree
if os.path.exists('./code'):
    with open('tree.json','w',encoding='utf-8') as f:
        json.dump(scan('./code'), f, ensure_ascii=False, indent=2)
    print('✅ Done')
"

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tree.json
          git commit -m "Auto update tree.json" || echo "No changes to skip"
          # 这里的推送不需要特殊令牌，因为是被其他流程触发的，权限更自然
          git push origin blogpage || echo "Nothing to push"